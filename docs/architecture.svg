<svg viewBox="0 0 900 1080" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a5d55"/>
    </marker>
  </defs>
  <rect width="900" height="1080" fill="#0d1210"/>

  <!-- Title -->
  <text x="450" y="42" fill="#e0a95e" font-size="26" font-weight="700" text-anchor="middle">VOLT — Architecture</text>
  <text x="450" y="66" fill="#8fa398" font-size="13" text-anchor="middle">Autonomous Household Resource Operator — built with the Strands Agents SDK</text>

  <!-- USER -->
  <rect x="370" y="90" width="160" height="46" rx="6" fill="#1a2320" stroke="#5eb8c4" stroke-width="1.5"/>
  <text x="450" y="118" fill="#e9efe9" font-size="15" text-anchor="middle">USER</text>
  <line x1="450" y1="136" x2="450" y2="168" stroke="#4a5d55" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- VOLT UI -->
  <rect x="330" y="170" width="240" height="50" rx="6" fill="#141b18" stroke="#26322d" stroke-width="1.5"/>
  <text x="450" y="192" fill="#e9efe9" font-size="14" text-anchor="middle">VOLT UI</text>
  <text x="450" y="209" fill="#8fa398" font-size="11" text-anchor="middle">Household Control Center (ui/index.html)</text>
  <line x1="450" y1="220" x2="450" y2="252" stroke="#4a5d55" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- EVENT LAYER -->
  <rect x="300" y="254" width="300" height="56" rx="6" fill="#141b18" stroke="#26322d" stroke-width="1.5"/>
  <text x="450" y="276" fill="#e9efe9" font-size="14" text-anchor="middle">EVENT LAYER</text>
  <text x="450" y="294" fill="#8fa398" font-size="11" text-anchor="middle">price change · weather change · device event · schedule</text>
  <line x1="450" y1="310" x2="450" y2="342" stroke="#4a5d55" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STRANDS AGENT -->
  <rect x="260" y="344" width="380" height="86" rx="6" fill="#141b18" stroke="#e0a95e" stroke-width="2"/>
  <text x="450" y="368" fill="#e0a95e" font-size="15" font-weight="700" text-anchor="middle">STRANDS AGENT</text>
  <text x="450" y="386" fill="#8fa398" font-size="11" text-anchor="middle">agent/orchestrator.py · agent/tools.py</text>
  <text x="450" y="402" fill="#8fa398" font-size="11" text-anchor="middle">observe · reason · choose tools · re-plan · escalate</text>
  <text x="450" y="418" fill="#5eb8c4" font-size="10" text-anchor="middle">(Bedrock-backed via build_strands_agent — policy/orchestration only, never touches hardware)</text>
  <line x1="450" y1="430" x2="450" y2="462" stroke="#4a5d55" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- OPTIMIZER -->
  <rect x="280" y="464" width="340" height="66" rx="6" fill="#141b18" stroke="#26322d" stroke-width="1.5"/>
  <text x="450" y="488" fill="#e9efe9" font-size="14" text-anchor="middle">POLICY / OPTIMIZER</text>
  <text x="450" y="506" fill="#8fa398" font-size="11" text-anchor="middle">optimizer/engine.py — deterministic, NOT the LLM</text>
  <text x="450" y="521" fill="#8fa398" font-size="10" text-anchor="middle">hard constraints · deadline scheduling · cost minimization</text>
  <line x1="450" y1="530" x2="450" y2="562" stroke="#4a5d55" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- DEVICE ADAPTERS -->
  <rect x="240" y="564" width="420" height="80" rx="6" fill="#141b18" stroke="#26322d" stroke-width="1.5"/>
  <text x="450" y="588" fill="#e9efe9" font-size="14" text-anchor="middle">DEVICE ADAPTERS</text>
  <text x="450" y="605" fill="#8fa398" font-size="11" text-anchor="middle">agent/adapters.py — one DeviceAdapter interface:</text>
  <text x="450" y="620" fill="#8fa398" font-size="10" text-anchor="middle">get_state() · apply_action() · verify_state()</text>
  <text x="450" y="635" fill="#5eb8c4" font-size="10" text-anchor="middle">Simulated (today) · BYD/EVSE · Home Assistant · SolarEdge (documented, not live)</text>
  <line x1="450" y1="644" x2="450" y2="676" stroke="#4a5d55" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- HOUSEHOLD SIMULATOR -->
  <rect x="280" y="678" width="340" height="66" rx="6" fill="#141b18" stroke="#26322d" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="450" y="702" fill="#e9efe9" font-size="14" text-anchor="middle">HOUSEHOLD SIMULATOR</text>
  <text x="450" y="720" fill="#8fa398" font-size="11" text-anchor="middle">simulator/environment.py</text>
  <text x="450" y="734" fill="#d9a441" font-size="10" text-anchor="middle">SIMULATED — stands in for real hardware until adapters go live</text>
  <line x1="450" y1="744" x2="450" y2="776" stroke="#4a5d55" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- VERIFY -->
  <rect x="330" y="778" width="240" height="50" rx="6" fill="#141b18" stroke="#5fae7a" stroke-width="1.5"/>
  <text x="450" y="800" fill="#5fae7a" font-size="14" text-anchor="middle">VERIFY</text>
  <text x="450" y="816" fill="#8fa398" font-size="10" text-anchor="middle">re-read actual device state, never assume success</text>
  <line x1="450" y1="828" x2="450" y2="860" stroke="#4a5d55" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STATE -->
  <rect x="300" y="862" width="300" height="50" rx="6" fill="#141b18" stroke="#26322d" stroke-width="1.5"/>
  <text x="450" y="884" fill="#e9efe9" font-size="14" text-anchor="middle">UPDATED STATE</text>
  <text x="450" y="900" fill="#8fa398" font-size="10" text-anchor="middle">domain/models.py — authoritative, not conversation history</text>

  <!-- loop back arrow -->
  <path d="M 600 887 C 760 887 760 380 640 380" fill="none" stroke="#4a5d55" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="770" y="640" fill="#8fa398" font-size="11" text-anchor="middle" transform="rotate(90 770 640)">agent continues monitoring</text>

  <!-- legend -->
  <rect x="60" y="960" width="14" height="14" fill="#141b18" stroke="#e0a95e" stroke-width="2"/>
  <text x="82" y="972" fill="#8fa398" font-size="12">Strands Agent — policy/orchestration layer (LLM)</text>
  <rect x="60" y="985" width="14" height="14" fill="#141b18" stroke="#26322d" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="82" y="997" fill="#8fa398" font-size="12">Simulated component (clearly labeled everywhere it appears)</text>
  <rect x="60" y="1010" width="14" height="14" fill="#141b18" stroke="#5fae7a" stroke-width="1.5"/>
  <text x="82" y="1022" fill="#8fa398" font-size="12">Deterministic safety/verification — outside the LLM's control</text>
</svg>
